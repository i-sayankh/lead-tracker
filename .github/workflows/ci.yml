name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/leads_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/leads_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app scripts
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m app.export_openapi
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not available in a job-level `if`, so detect the app and guard each step.
      - name: Detect frontend
        working-directory: .
        run: test -f frontend/package.json && echo "HAS_FRONTEND=true" >> "$GITHUB_ENV" || true
      - uses: actions/setup-node@v4
        if: env.HAS_FRONTEND == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: env.HAS_FRONTEND == 'true'
        run: npm ci
      - name: API types are up to date
        if: env.HAS_FRONTEND == 'true'
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - if: env.HAS_FRONTEND == 'true'
        run: npm run typecheck
      - if: env.HAS_FRONTEND == 'true'
        run: npm run lint
      - if: env.HAS_FRONTEND == 'true'
        run: npm test -- --run
      - if: env.HAS_FRONTEND == 'true'
        run: npm run build
